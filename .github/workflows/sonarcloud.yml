name: SonarCloud Scan

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud to analyze full history

      # ✅ Set up Node.js (you can change version if needed)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ✅ Install backend dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      # ✅ Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      # ✅ Optional: Run tests (uncomment if you have test scripts)
      # - name: Run backend tests
      #   working-directory: backend
      #   run: npm test -- --coverage
      #
      # - name: Run frontend tests
      #   working-directory: frontend
      #   run: npm test -- --coverage

      # ✅ Run SonarCloud Scan
      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Provided by GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # You created this in repo secrets

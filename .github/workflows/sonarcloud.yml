name: SonarCloud Analysis

on:
  push:
    branches:
      - feature/frontend/note-generation-AI  # 👈 your branch name
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: Analyze with SonarCloud
    runs-on: ubuntu-latest   # ✅ GitHub Actions runner (Linux is fine, even if you use Windows locally)

    steps:
      # Step 1: Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required for SonarCloud to see the full commit history

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      # Step 4: Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      # (Optional) Step 5: Run tests to generate coverage files
      # - name: Run backend tests
      #   working-directory: ./backend
      #   run: npm test -- --coverage
      #
      # - name: Run frontend tests
      #   working-directory: ./frontend
      #   run: npm test -- --coverage --watchAll=false

      # Step 6: Run SonarCloud analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

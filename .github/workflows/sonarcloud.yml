name: SonarCloud Scan

on:
  push:
    branches: [ feature/frontend/note-generation-AI ]
  pull_request:
    branches: [ feature/frontend/note-generation-AI ]

jobs:
  sonarcloud:
    name: Analyze with SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install root dependencies if present
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "No root lockfile - skipping"
          fi

      - name: Install backend dependencies
        run: |
          if [ -d backend ]; then
            cd backend
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install
            fi
          else
            echo "No backend folder - skipping"
          fi

      - name: Install frontend dependencies
        run: |
          if [ -d frontend ]; then
            cd frontend
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install
            fi
          else
            echo "No frontend folder - skipping"
          fi

      - name: (Optional) Run tests to produce coverage
        run: |
          if [ -d frontend ] && [ -f frontend/package.json ]; then
            cd frontend && npm run test -- --coverage || true
            cd ..
          fi
          if [ -d backend ] && [ -f backend/package.json ]; then
            cd backend && npm run test -- --coverage || true
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG_KEY }}
            -Dsonar.sources=frontend,backend
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

name: Deploy .NET Backend to Server

on:
  push:
    branches:
      - feature/frontend/note-generation-AI  # 👈 your working branch

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Placeholder for deployment
        run: |
          echo "✅ Workflow successful — next step is connecting to company Windows Server."
